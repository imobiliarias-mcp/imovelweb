[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "imovelweb-research"
version = "0.1.0"
description = "Central rental research MCP module for Imovelweb"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "beautifulsoup4>=4.12.0",
    "lxml>=5.0.0",
    "httpx>=0.27.0",
    "patchright>=1.63.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
]

[tool.hatch.build.targets.wheel]
packages = ["scripts"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
markers = [
    "integration: mark test as integration test",
]
